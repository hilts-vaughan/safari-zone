name: Package Safari Zone

on:
  push:
  workflow_dispatch:
    inputs:
      make_release:
        description: Publish a GitHub Release with SafariZone.zip
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Package checked-in exported mod
        run: |
          mkdir -p docs
          python tools/package_mod.py
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SafariZone-${{ github.sha }}
          path: dist/SafariZone.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.make_release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested ZIP
        uses: actions/download-artifact@v4
        with:
          name: SafariZone-${{ github.sha }}
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" release/SafariZone.zip \
            --target "$GITHUB_SHA" \
            --title "Safari Zone ${GITHUB_SHA:0:7}" \
            --generate-notes
