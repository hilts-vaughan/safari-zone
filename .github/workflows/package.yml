name: Package Safari Zone

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression checks
        run: python -m unittest discover -s tests -v
      - name: Package checked-in exported mod
        run: |
          mkdir -p docs
          python tools/package_mod.py
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SafariZone-${{ github.sha }}
          path: dist/SafariZone.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
